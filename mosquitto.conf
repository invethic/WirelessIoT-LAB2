# CPLab Tracking - Mosquitto 2.x configuration (laptop broker)
# Windows : C:\Program Files\mosquitto\mosquitto.conf  -> restart the "Mosquitto Broker" service
# Linux   : /etc/mosquitto/conf.d/cplab.conf           -> sudo systemctl restart mosquitto

per_listener_settings false

# MQTT for the Tab5 and Node-RED
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets for the web supervision site
listener 9001 0.0.0.0
protocol websockets

# Lab network: anonymous access. For a protected setup:
#   mosquitto_passwd -c passwd cplab   then replace the line below by
#   allow_anonymous false
#   password_file <path>/passwd
allow_anonymous true

# keep retained messages (counts, OF, stats) across broker restarts
persistence true
autosave_interval 60
